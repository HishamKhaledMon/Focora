<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="عداد مذاكرة وتركيز مجاني لحساب وقت الدراسة بسهولة، مع الوضع الداكن والساطع وميزة ملء الشاشة.">
    <title>Focora</title>
    <link rel="icon" type="image/png" href="./focora-favicon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="timer" id="timer">
            00:00:00
        </div>

        <div class="buttons">
            <button id="startBtn" class="start-btn">ابدأ</button>

            <button id="resetBtn" class="reset-btn">
                إعادة الضبط
            </button>

            <button id="fullscreenBtn" class="icon-btn" title="ملء الشاشة">
                ⛶
            </button>

            <button id="themeBtn" class="icon-btn" title="تغيير الوضع">
                ☀️
            </button>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
